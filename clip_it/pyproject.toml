[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipops"
version = "1.0.0"
description = "Clip Operations Center - Multi-brand AI Video Clipping Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ClipForge Team", email = "dev@clipforge.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.4.9",
    "requests>=2.31",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "ffmpeg-python>=0.2",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-genai>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clipops*"]

[project.scripts]
clipops = "clipops.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]